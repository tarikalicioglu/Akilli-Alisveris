name: Market tekliflerini güncelle

on:
  schedule:
    - cron: "17 5 * * 1"   # Pazartesi ~06:17 (Almanya)
    - cron: "17 5 * * 4"   # Perşembe ~06:17
  workflow_dispatch:
    inputs:
      zip:
        description: "Posta kodu (boşsa config.json)"
        required: false

permissions:
  contents: write

concurrency:
  group: offers
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Teklifleri çek
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ZIP: ${{ github.event.inputs.zip }}
        run: node scripts/fetch-offers.mjs
      - name: Kaydet
        run: |
          git config user.name "teklif-botu"
          git config user.email "actions@users.noreply.github.com"
          git add data/offers.json
          git diff --cached --quiet || (git commit -m "Teklifler güncellendi" && git push)
